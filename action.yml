# Github action to create a preview for pullrequests
# Brand Boosting GmbH | David Süßlin
name: "Create Shopify Theme Preview"
description: "Create a Shopify Theme Preview"
branding:
  icon: shopping-cart
  color: green
inputs:
  shopify_flag_store:
    description: "Store URL, like your-store.myshopify.com"
    required: true
  shopify_cli_theme_token:
    description: "Password generated from Theme Access app"
    required: true
  github_token:
    description: "GitHub token for managing PR labels"
    required: true
  build_step:
    description: "Command used as build step"
    default: 'echo "No build step"'
    required: false
  dir:
    description: "Directory to preview."
    default: "."
    required: false
  timezone:
    description: "TZ identifier"
    required: false
    default: "UTC"
  ignore:
    description: "Files to ignore when pushing (preserves Customizer changes). Multiple patterns separated by space."
    required: false
    default: "config/settings_data.json templates/*.json"

runs:
  using: "composite"
  steps:
    - name: Set timezone
      uses: szenius/set-timezone@v1.2
      with:
        timezoneLinux: ${{ inputs.timezone }}
    - name: Get Date # Get current date
      id: date
      shell: bash
      run: echo "date=$(date +'%d-%m-%Y ')" >> $GITHUB_OUTPUT
    - name: Get Time # Get current time
      id: time
      run: echo "time=$(date +'%H:%M:%S')" >> $GITHUB_OUTPUT
      shell: bash
    - name: Find Comment
      uses: peter-evans/find-comment@v3
      id: find-comment
      with:
        issue-number: ${{ github.event.issue.number || github.event.pull_request.number }}
        comment-author: "github-actions[bot]"
        body-includes: "Shopify Theme Preview"
    - name: Comment Loading # Create skeleton table and visualize loading state
      id: create-comment
      uses: peter-evans/create-or-update-comment@v3.1.0
      with:
        comment-id: ${{ steps.find-comment.outputs.comment-id }}
        issue-number: ${{ github.event.issue.number || github.event.pull_request.number }}
        body: |
          Shopify Theme Preview

          | Name | Status | Preview | Editor | Date | Time |
          | :--- | :----- | :------ | :------ | :------ | :----- |
          | ${{ inputs.shopify_flag_store }} | 🔄 Loading |  |  | ${{ steps.date.outputs.date }} | ${{ steps.time.outputs.time }}

          *created by Brand Boosting GmbH | PotatoBot* [View on GitHub Marketplace](https://github.com/marketplace/actions/create-shopify-theme-preview)
        edit-mode: replace
    - uses: actions/checkout@v4 # Action checkout@v4
    - name: Checkout Pull Request # Set the right branch for the commented PR
      run: gh pr checkout ${{ github.event.issue.number || github.event.pull_request.number }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
      shell: bash
    - uses: actions/setup-node@v4 # Action setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
    - uses: ruby/setup-ruby@v1 # Action setup-ruby@v1
      with:
        ruby-version: 3.1
        bundler: "latest"
    - name: Install Shopify CLI
      run: npm install -g @shopify/cli@3.63.1 @shopify/theme@3.58.2
      shell: bash
    - name: Check Version
      run: shopify version
      shell: bash
    - name: Build step
      run: ${{ inputs.build_step }}
      shell: bash
    - name: Get existing theme ID from PR labels
      id: get-theme-id
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        PR_NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
        
        # Get all labels from PR and find theme-id label
        THEME_LABEL=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name | select(startswith("theme-id:"))' 2>/dev/null || echo "")
        
        if [ -n "$THEME_LABEL" ]; then
          # Extract theme ID from label (format: theme-id:123456789)
          THEME_ID="${THEME_LABEL#theme-id:}"
          echo "Found existing theme ID: $THEME_ID"
          echo "theme_id=$THEME_ID" >> $GITHUB_OUTPUT
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "No existing theme ID found, will create new development theme"
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
    - name: Check existing theme still exists # Shopify deletes development themes after ~7 days idle
      id: check-theme
      if: ${{ steps.get-theme-id.outputs.exists == 'true' }}
      shell: bash
      env:
        SHOPIFY_FLAG_STORE: ${{ inputs.shopify_flag_store }}
        SHOPIFY_CLI_THEME_TOKEN: ${{ inputs.shopify_cli_theme_token }}
        GH_TOKEN: ${{ inputs.github_token }}
        THEME_ID: ${{ steps.get-theme-id.outputs.theme_id }}
      run: |
        PR_NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"

        # Fail on CLI/API errors instead of treating them as a missing theme
        THEMES=$(shopify theme list --json)
        if ! echo "$THEMES" | jq -e 'type == "array"' > /dev/null; then
          echo "::error::Unexpected output from 'shopify theme list --json'"
          echo "$THEMES"
          exit 1
        fi

        if echo "$THEMES" | jq -e --arg id "$THEME_ID" 'any(.[]; (.id | tostring) == $id)' > /dev/null; then
          echo "Theme $THEME_ID still exists"
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "::warning::Theme $THEME_ID no longer exists, removing stale label and creating a new development theme"
          gh pr edit "$PR_NUMBER" --remove-label "theme-id:$THEME_ID"
          gh label delete "theme-id:$THEME_ID" --yes 2>/dev/null || true
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
    - name: Create Preview Link # and save the returned theme data in step outputs
      id: link
      shell: bash
      env:
        # Store URL, like your-store.myshopify.com
        SHOPIFY_FLAG_STORE: ${{ inputs.shopify_flag_store }}
        # Password generated from Theme Access app
        SHOPIFY_CLI_THEME_TOKEN: ${{ inputs.shopify_cli_theme_token }}
        THEME_ID: ${{ steps.get-theme-id.outputs.theme_id }}
      run: |
        PUSH_OUTPUT="$RUNNER_TEMP/theme-push.txt"

        if [ "${{ steps.check-theme.outputs.exists }}" == "true" ]; then
          IGNORE_FLAGS=""
          if [ -n "${{ inputs.ignore }}" ]; then
            for pattern in ${{ inputs.ignore }}; do
              IGNORE_FLAGS="$IGNORE_FLAGS --ignore $pattern"
            done
            echo "Ignoring files to preserve Customizer changes: ${{ inputs.ignore }}"
          fi

          echo "Pushing to existing theme: $THEME_ID"
          shopify theme push --json --theme "$THEME_ID" --path ${{ inputs.dir }} $IGNORE_FLAGS > "$PUSH_OUTPUT"
        else
          echo "Creating new development theme"
          shopify theme push --json --development --path ${{ inputs.dir }} > "$PUSH_OUTPUT"
        fi

        # Upload errors still return JSON (with a warning); anything else is a failed push
        RESULT=$(tail -n1 "$PUSH_OUTPUT")
        if ! echo "$RESULT" | jq -e '.theme.id' > /dev/null 2>&1; then
          echo "::error::'shopify theme push' did not return theme JSON"
          cat "$PUSH_OUTPUT"
          exit 1
        fi

        WARNING=$(echo "$RESULT" | jq -r '.theme.warning // empty')
        if [ -n "$WARNING" ]; then
          echo "::warning::$WARNING"
        fi

        echo "theme_id=$(echo "$RESULT" | jq -r '.theme.id')" >> $GITHUB_OUTPUT
        echo "preview_url=$(echo "$RESULT" | jq -r '.theme.preview_url')" >> $GITHUB_OUTPUT
        echo "editor_url=$(echo "$RESULT" | jq -r '.theme.editor_url')" >> $GITHUB_OUTPUT
    - name: Save theme ID to PR label
      if: ${{ steps.check-theme.outputs.exists != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        THEME_ID: ${{ steps.link.outputs.theme_id }}
      run: |
        PR_NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
        echo "Saving theme ID $THEME_ID as label on PR #$PR_NUMBER"

        # Create label if it doesn't exist
        gh label create "theme-id:$THEME_ID" --description "Shopify theme preview ID" --color "CFE7FF" 2>/dev/null || true

        # Add label to PR
        gh pr edit "$PR_NUMBER" --add-label "theme-id:$THEME_ID"
    - name: Comment Link # Override the loading comment from the start with the actual values and links
      uses: peter-evans/create-or-update-comment@v3.1.0
      with:
        comment-id: ${{ steps.create-comment.outputs.comment-id }}
        body: |
          Shopify Theme Preview

          | Name | Status | Preview | Editor | Date | Time |
          | :--- | :----- | :------ | :------ | :------ | :----- |
          | ${{ inputs.shopify_flag_store }} | ✅ Ready | <a href="${{ steps.link.outputs.preview_url }}" target="_blank">Preview</a> | [Editor](${{ steps.link.outputs.editor_url }}) | ${{ steps.date.outputs.date }} | ${{ steps.time.outputs.time }}

          *created by Brand Boosting GmbH | PotatoBot* [View on GitHub Marketplace](https://github.com/marketplace/actions/create-shopify-theme-preview)
        reactions: hooray
        edit-mode: replace
    - name: Output Step Failed # Create skeleton table and visualize failed state
      if: ${{ failure() }}
      uses: peter-evans/create-or-update-comment@v3.1.0
      with:
        comment-id: ${{ steps.create-comment.outputs.comment-id }}
        issue-number: ${{ github.event.issue.number || github.event.pull_request.numberr }}
        body: |
          Shopify Theme Preview

          | Name | Status | Preview | Editor | Date | Time |
          | :--- | :----- | :------ | :------ | :------ | :----- |
          | ${{ inputs.shopify_flag_store }} | ❌ Failed |  |  | ${{ steps.date.outputs.date }} | ${{ steps.time.outputs.time }}

          ❌ 'Create Preview Link' failed ❌

          Please check if the following `inputs` are set correctly:
          - `shopify_cli_theme_token` [(?)](https://shopify.dev/themes/tools/theme-access)
          - `shopify_flag_store` 

          *created by Brand Boosting GmbH | PotatoBot* <p style="float: right;">[View on GitHub Marketplace](https://github.com/marketplace/actions/create-shopify-theme-preview)</p>
        edit-mode: replace
